server:
  port: 9080

spring:
  application:
    name: registration-service
  datasource:
    # H2 in-memory by default; point at MySQL with DB_URL/DB_USER/DB_PASSWORD (see docker-compose.yml)
    url: ${DB_URL:jdbc:h2:mem:registrations;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    directory: ${UPLOAD_DIR:./uploads}
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg

management:
  endpoints:
    web:
      exposure:
        include: health
