# Optional: run the backend against MySQL instead of in-memory H2.
#   docker compose up -d
#   cd backend && DB_URL=jdbc:mysql://localhost:3306/registrations DB_USER=app DB_PASSWORD=app ./mvnw spring-boot:run
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: registrations
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20
